<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0809">
<title>Finance Guru</title>
<style>
:root {
  --bg: #0B0809; --bg2: #120C0E;
  --glass: rgba(255,255,255,.045); --glass2: rgba(255,255,255,.075); --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --text: #FFFFFF; --muted: #8F8A8D; --dim: #5E585B;
  --accent: #F0364F; --accent2: #C8102E; --accent-soft: rgba(240,54,79,.14);
  --pos: #3DDC84; --amber: #F2B544; --neg: #FF5C6F;
  --grad: linear-gradient(180deg, #FF4D63 0%, #D9142E 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 60% at 50% -10%, rgba(150,22,42,.55) 0%, rgba(80,12,24,.25) 40%, transparent 70%), var(--bg); }
#app { max-width: 430px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; z-index: 1; }
#screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: calc(18px + max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px))) 16px 110px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#screen::-webkit-scrollbar { display: none; }
#screen.slide-left { animation: slL .22s ease; } #screen.slide-right { animation: slR .22s ease; }
@keyframes slL { from { transform: translateX(36px); opacity: .3 } to { transform: none; opacity: 1 } }
@keyframes slR { from { transform: translateX(-36px); opacity: .3 } to { transform: none; opacity: 1 } }

svg.i { display: block; flex-shrink: 0; }

/* Floating glass tab bar */
#bottomnav { position: fixed; bottom: calc(14px + max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px))); left: 50%; transform: translateX(-50%); width: calc(100% - 28px); max-width: 402px;
  background: rgba(28,22,24,.72); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--line2); border-radius: 999px; padding: 6px; display: flex; gap: 4px; z-index: 20; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
#bottomnav.hidden { display: none; }
.nav-btn { flex: 1; background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 54px; justify-content: center; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; border-radius: 999px; transition: background .2s, color .2s; }
.nav-btn.active { color: #fff; background: rgba(255,255,255,.08); } .nav-btn.active svg { color: var(--accent); }

/* Cards: frosted glass */
.card { background: var(--glass); border-radius: 22px; padding: 16px; border: 1px solid var(--line); margin-bottom: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.card.gold { border-color: rgba(240,54,79,.35); background: linear-gradient(160deg, rgba(240,54,79,.16), rgba(255,255,255,.03) 55%); }
.card.green { border-color: rgba(242,181,68,.3); background: linear-gradient(160deg, rgba(242,181,68,.11), rgba(255,255,255,.03) 55%); }
.lbl { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .gold-t { color: var(--accent); } .green-t { color: var(--pos); } .red-t { color: var(--neg); } .amber-t { color: var(--amber); }
.big { font-size: 44px; font-weight: 700; color: #fff; margin: 6px 0 10px; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { background: var(--glass2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip.w { color: #fff; } .chip.g { color: var(--pos); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.h2 { font-size: 17px; font-weight: 600; margin: 8px 2px 10px; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; } .topbar .sub { font-size: 12px; color: var(--muted); }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--glass2); border: 1px solid var(--line2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--glass2); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: #fff; }

/* Home hero (no box, like a balance header) */
.hero { text-align: center; padding: 6px 0 18px; }
.hero .lbl { justify-content: center; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; }
.hero .big .dec { color: var(--dim); }

/* Quick actions panel */
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 16px 8px; margin-bottom: 14px; background: var(--glass); border: 1px solid var(--line); border-radius: 24px; }
.qa button { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; min-height: 44px; }
.qa .circ { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; transition: transform .12s; color: #fff; }
.qa button:first-child .circ { background: var(--grad); border-color: transparent; box-shadow: 0 8px 24px rgba(240,54,79,.45); }
.qa button:active .circ { transform: scale(.92); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two .card { margin-bottom: 14px; }
.bal { font-size: 21px; font-weight: 700; margin: 8px 0; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.pbar { background: rgba(255,255,255,.08); border-radius: 999px; height: 6px; overflow: hidden; margin: 8px 0; }
.pbar > div { height: 100%; border-radius: 999px; transition: width .4s ease; }

.list-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; min-height: 44px; }
.list-row + .list-row { border-top: 1px solid var(--line); }
.list-row .ico { width: 42px; height: 42px; border-radius: 13px; background: rgba(255,255,255,.07); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #E9E4E6; }
.list-row .ico.pos { color: var(--pos); } .list-row .ico.acc { color: var(--accent); } .list-row .ico.amb { color: var(--amber); }
.list-row .mid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; } .list-row .mid > div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.list-row .mid.stack { display: block; } .list-row .mid.stack > div:first-child { font-weight: 500; }
.list-row .mid svg { color: var(--muted); }
.amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.flow-row { border-left: 3px solid; padding: 10px 14px; margin: 8px 0; display: flex; justify-content: space-between; border-radius: 4px 14px 14px 4px; background: rgba(255,255,255,.04); }
.x-btn { width: 44px; height: 44px; border: none; background: none; color: var(--muted); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
.x-btn:hover { color: var(--neg); }
.sm-btn { background: none; color: var(--accent); border: none; padding: 0 6px; min-height: 40px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
.sm-btn.ghost { color: var(--accent); }
.toggle { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: rgba(255,255,255,.14); border-radius: 999px; cursor: pointer; transition: .2s; }
.toggle span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.toggle input:checked + span { background: var(--accent); } .toggle input:checked + span::before { transform: translateX(20px); }
.toggle-wrap { min-width: 48px; min-height: 44px; display: flex; align-items: center; }

input, select { background: rgba(255,255,255,.06); border: 1px solid var(--line2); border-radius: 14px; color: #fff; padding: 14px 16px; font-size: 16px; width: 100%; font-family: inherit; }
input::placeholder { color: var(--dim); }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
select option { background: #1A1416; }
input.amount { font-size: 32px; font-weight: 700; text-align: center; letter-spacing: -.5px; }
.field { margin-bottom: 12px; } .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.btn { background: var(--grad); color: #fff; border: none; border-radius: 16px; padding: 15px 24px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; font-family: inherit; min-height: 52px; transition: transform .1s; box-shadow: 0 8px 24px rgba(240,54,79,.3); }
.btn:active, .sm-btn:active, .seg button:active { transform: scale(.97); }
.btn.ghost { background: rgba(255,255,255,.06); color: #fff; border: 1px solid var(--line2); box-shadow: none; }
.btn.green { background: linear-gradient(180deg, #F7C25C, #DE9A1E); color: #1A1206; box-shadow: 0 8px 24px rgba(242,181,68,.25); }
.btn.ghost.green { background: rgba(255,255,255,.06); color: #fff; border: 1px solid var(--line2); box-shadow: none; }
.btn.red { background: var(--grad); color: #fff; }
.btn:disabled { opacity: .4; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.seg { display: flex; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 16px; }
.seg button { flex: 1; background: none; border: none; color: var(--muted); padding: 10px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 42px; font-family: inherit; }
.seg button.on { background: rgba(255,255,255,.1); color: #fff; }
.warn { background: var(--accent-soft); color: var(--neg); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 14px; margin-bottom: 8px; cursor: pointer; min-height: 52px; background: rgba(255,255,255,.04); color: #fff; }
.pick.on { border-color: var(--accent); background: var(--accent-soft); }
.pick .ico { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; }

#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 40; display: none; }
#overlay.show { display: block; animation: fade .25s; }
@keyframes fade { from { opacity: 0 } }
#sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 430px; max-height: 88vh; overflow-y: auto; background: linear-gradient(180deg, #221A1D, #151012); border: 1px solid var(--line2); border-bottom: none; border-radius: 28px 28px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom)); z-index: 50; display: none; }
#sheet.show { display: block; animation: slideUp .3s cubic-bezier(.2,.8,.2,1); }
@keyframes slideUp { from { transform: translate(-50%, 100%) } to { transform: translate(-50%, 0) } }
.handle { width: 40px; height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; margin: 0 auto 16px; }
.sheet-title { font-size: 21px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; letter-spacing: -.3px; }
.sheet-title svg { color: var(--accent); }
#toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-120px); background: rgba(30,24,26,.92); backdrop-filter: blur(16px); border: 1px solid var(--line2); color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 99; transition: transform .3s ease; max-width: 90%; text-align: center; border-left: 3px solid var(--pos); }
#toast.show { transform: translateX(-50%) translateY(0); }

.splash { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding-bottom: 20px; }
.logo { width: 88px; height: 88px; border-radius: 28px; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; margin: 0 auto 8px; animation: pulse 2.4s ease-in-out infinite; box-shadow: 0 16px 50px rgba(240,54,79,.45); color: #fff; }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
.splash h1 { text-align: center; font-size: 30px; letter-spacing: -.6px; } .splash p.t { text-align: center; color: var(--muted); margin-bottom: 10px; }
.wt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.wt .pick { margin: 0; justify-content: center; font-size: 14px; }

.chart-wrap { position: relative; }
canvas#chart { width: 100%; height: 220px; display: block; touch-action: pan-y; }
#tip { position: absolute; background: rgba(20,15,17,.95); border: 1px solid var(--line2); color: #fff; padding: 6px 10px; border-radius: 10px; font-size: 12px; pointer-events: none; display: none; white-space: nowrap; transform: translate(-50%, -110%); font-weight: 600; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 10px; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcard { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 14px; position: relative; }
.mcard.lean { background: linear-gradient(160deg, rgba(255,92,111,.14), rgba(255,255,255,.02)); border-color: rgba(255,92,111,.35); }
.mcard.cur { background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); border-color: var(--line2); }
.badge { position: absolute; top: 12px; right: 12px; background: var(--accent-soft); color: var(--neg); font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 999px; letter-spacing: .8px; }
.badge.g { background: rgba(255,255,255,.12); color: #fff; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
table.cmp th { text-align: left; color: var(--muted); font-size: 11px; padding: 8px 6px; border-bottom: 1px solid var(--line2); font-weight: 600; }
table.cmp td { padding: 13px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cmp tr:last-child td { border-bottom: none; }
table.cmp td:nth-child(2) { color: var(--neg); } table.cmp td:nth-child(3) { color: var(--pos); font-weight: 600; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; margin-bottom: 10px; border: 1px solid var(--line); background: var(--glass); }
.alert .ico { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(255,255,255,.07); }
.alert.danger { border-color: rgba(255,92,111,.4); background: linear-gradient(160deg, rgba(255,92,111,.16), rgba(255,255,255,.02)); } .alert.danger .ico { color: var(--neg); }
.alert.warn { border-color: rgba(242,181,68,.35); background: linear-gradient(160deg, rgba(242,181,68,.12), rgba(255,255,255,.02)); } .alert.warn .ico { color: var(--amber); }
.alert.ok { border-color: rgba(61,220,132,.35); background: linear-gradient(160deg, rgba(61,220,132,.12), rgba(255,255,255,.02)); } .alert.ok .ico { color: var(--pos); }
.alert.warn b { color: var(--amber); } .alert.danger b { color: var(--neg); } .alert.ok b { color: var(--pos); }
.alert b { display: block; font-size: 14px; margin-bottom: 3px; } .alert p { font-size: 13px; color: #D9D3D6; line-height: 1.45; }
.sms-cta { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.sms-cta .ico { width: 42px; height: 42px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sms { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; background: rgba(255,255,255,.035); transition: border-color .3s, background .3s; }
.sms .from { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px; display: flex; justify-content: space-between; gap: 8px; }
.sms .txt { font-size: 12.5px; color: #CFC9CC; line-height: 1.4; margin-top: 4px; word-break: break-word; }
.sms .res { margin-top: 8px; font-size: 13px; display: none; align-items: center; gap: 8px; }
.sms.ok { border-color: rgba(61,220,132,.45); } .sms.ok .res { display: flex; }
.sms.skip { opacity: .55; } .sms.skip .res { display: flex; color: var(--muted); }
.tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.1); letter-spacing: .4px; }
textarea { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--line2); border-radius: 14px; color: #fff; padding: 12px; font: inherit; font-size: 14px; resize: vertical; min-height: 80px; }
.fc-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; } .fc-row + .fc-row { border-top: 1px solid var(--line); }
.fc-row .m { width: 64px; font-weight: 600; white-space: nowrap; } .fc-row .rng { flex: 1; font-size: 12px; color: var(--muted); }
.prob { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.08); white-space: nowrap; }
.prob.hi { background: var(--accent-soft); color: var(--neg); } .prob.mid { background: rgba(242,181,68,.15); color: var(--amber); }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; text-align: center; }
.stat div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px 4px; } .stat b { display: block; font-size: 18px; } .stat span { font-size: 10.5px; color: var(--muted); }
.step { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; } .step + .step { border-top: 1px solid var(--line); } .step small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.info li { margin: 10px 0 0 18px; font-size: 14px; line-height: 1.5; color: #D9D3D6; }
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav id="bottomnav" class="hidden">
    <button class="nav-btn" data-tab="home"><span class="ic" data-i="home"></span>Home</button>
    <button class="nav-btn" data-tab="budget"><span class="ic" data-i="wallet"></span>Budget</button>
    <button class="nav-btn" data-tab="buffers"><span class="ic" data-i="shield"></span>Buffers</button>
    <button class="nav-btn" data-tab="trends"><span class="ic" data-i="chart"></span>Trends</button>
  </nav>
</div>
<div id="overlay"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ================= 1. STATE & CONFIG ================= */
const STORE_KEY = 'fg_v2';
const VERSION = 'v2.0';
const TABS = ['home', 'budget', 'buffers', 'trends'];
/* Line icons (24×24, stroke = currentColor) */
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  wallet: '<path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h14a1.5 1.5 0 0 0 1.5-1.5v-10A1.5 1.5 0 0 0 19.5 7H5.5A2.5 2.5 0 0 1 3 4.5"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  shield: '<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  chart: '<path d="M3 21h18M6.5 17v-5M11 17V6M15.5 17v-8M20 17v-3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  send: '<path d="M7 17 17 7M8.5 7H17v8.5"/>',
  receive: '<path d="M17 7 7 17M15.5 17H7V8.5"/>',
  save: '<path d="M12 3.5v11m0 0-4.5-4.5m4.5 4.5 4.5-4.5M4.5 20.5h15"/>',
  draw: '<path d="M12 20.5v-11m0 0L7.5 14M12 9.5l4.5 4.5M4.5 3.5h15"/>',
  settings: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 21c1.4-3.8 4.3-5.8 7.5-5.8s6.1 2 7.5 5.8"/>',

function monthKeyOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmt(n) { return '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
/* Local cache: last state from the server + login token (so the app opens instantly) */
let TOKEN = null;
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); if (TOKEN) localStorage.setItem(STORE_KEY + '_token', TOKEN); } catch (e) {} }
function loadState() {
  try {
    TOKEN = localStorage.getItem(STORE_KEY + '_token');
    const raw = localStorage.getItem(STORE_KEY);
    if (raw && TOKEN) STATE = { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) {}
}
function clearSession() {
  TOKEN = null; STATE = defaultState();
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_KEY + '_token'); } catch (e) {}
}

/* ---- Backend API client ---- */
const API_BASE = location.protocol === 'file:' ? 'http://localhost:3000/api' : '/api';
let busy = false;
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  let res;
  try { res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Cannot reach the server. Is it running?'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && TOKEN) { clearSession(); closeSheet(); render(); throw new Error('Session expired. Please log in.'); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  if (data.token) TOKEN = data.token;
  if (data.state) { STATE = { ...defaultState(), ...data.state }; persist(); }
  return data;
}
/* Run an API call from a button: blocks double taps, shows errors as a toast */
async function act(btn, fn, okMsg) {
  if (busy) return; busy = true;
  const label = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Please wait…'; }
  try { const d = await fn(); closeSheet(); render(); if (okMsg) toast(okMsg); return d || true; }
  catch (e) { toast(e.message, '#FF5C6F'); if (!document.getElementById('sheet').classList.contains('show')) render(); }
  finally { busy = false; if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
function currentMonth() { return new Date().toLocaleString('en-IN', { month: 'short', year: '2-digit' }); }
function monthYearLong() { return new Date().toLocaleString('en-IN', { month: 'long', year: 'numeric' }); }
function shortDate(iso) { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
function calcSafeToSpend() {
  const inc = STATE.monthIncome, exp = STATE.totalExpenses;
  const pct = inc > 20000 ? 0.15 : inc > 15000 ? 0.10 : 0;
  const save = Math.round(inc * pct);
  const safe = Math.max(0, inc - exp - save);
  return { safe, save, pct, inc, exp };
}
function recalcExpenses() { STATE.totalExpenses = STATE.expenses.filter(e => e.active).reduce((s, e) => s + e.amount, 0); }
function spentThisMonth() {
  const k = monthKeyOf(new Date());
  return STATE.activity.filter(a => a.type === 'expense' && a.date.slice(0, 7) === k).reduce((s, a) => s + a.amount, 0);
}
function incomeLogTotal() { return STATE.incomeLog.reduce((s, e) => s + e.amount, 0); }
function addActivity(type, amount, note, icon) {
  STATE.activity.unshift({ date: todayISO(), type, amount, note, icon });
  STATE.activity = STATE.activity.slice(0, 100);
}
function addBufferTx(fund, kind, amount, note) {
  STATE.bufferTx.unshift({ fund, kind, amount, note, date: todayISO() });
  STATE.bufferTx = STATE.bufferTx.slice(0, 100);
}
function pct(a, b) { return b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0; }
function toast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.borderLeftColor = color || '#3DDC84'; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function countUp(el, to) {
  const from = Number(el.dataset.val || 0); el.dataset.val = to;
  if (from === to) { el.textContent = fmt(to); return; }
  const start = performance.now();
  function step(now) {
    const p = Math.min(1, (now - start) / 600), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function chartData() {
  const now = new Date(), curLabel = now.toLocaleString('en-US', { month: 'short' }), curYear = String(now.getFullYear()).slice(2);
  const data = STATE.history.map(h => ({ ...h }));
  const last = data[data.length - 1];
  if (last && last.month === curLabel && last.year === curYear) { last.income = STATE.monthIncome; last.saved = calcSafeToSpend().save; }
  else data.push({ month: curLabel, year: curYear, income: STATE.monthIncome, saved: calcSafeToSpend().save, leanDep: 0, emerDep: 0 });
  const hist = data.slice(-12).map((m, i, arr) => {
    const current = i === arr.length - 1;
    return { ...m, current, lean: !current && m.income < LEAN_LIMIT };
  });
  return hist;
}
function chartDataWithForecast() {
  const hist = chartData().slice(-9);
  const fc = ((STATE.insights && STATE.insights.outlook) || []).slice(0, 3).map(f => ({ month: f.label.split(' ')[0], year: f.key.slice(2, 4), income: f.amount, forecast: true, pLean: f.pLean, low: f.low, high: f.high }));
  return hist.concat(fc);
}

function bindSheetDrag(sh) {
  const h = sh.querySelector('.handle'); let y0 = null;
  h.ontouchstart = e => { y0 = e.touches[0].clientY; };
  h.ontouchmove = e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translate(-50%, ${dy}px)`; };
  h.ontouchend = e => { const dy = e.changedTouches[0].clientY - (y0 || 0); y0 = null; sh.style.transform = ''; if (dy > 80) closeSheet(); };
  h.onclick = closeSheet;

  else fallbackCopy(json, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed', '#FF5C6F'); }
  ta.remove();
}

/* ---- SMS import (web demo of the Android SMS reader) ---- */
let SMS_INBOX = [];
/* Native Android SMS reader (only present inside the Android app) */
const NATIVE_SMS = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.SmsReader) || null;
const monthStartMs = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
async function readPhoneSms(since) {
  const st = await NATIVE_SMS.status();
  if (!st.granted && !(await NATIVE_SMS.requestAccess()).granted) throw new Error('Allow SMS access to read bank messages');
  return (await NATIVE_SMS.readInbox({ since, limit: 200 })).messages.map(m => ({ sender: m.sender || 'BANK', text: m.text }));
}
/* Auto-import: new bank SMS since the last sync (on open / when the app comes back) */
async function syncPhoneSms() {
  if (!NATIVE_SMS || !TOKEN || busy) return;
  try {
    if (!(await NATIVE_SMS.status()).granted) return;
    let last = 0; try { last = +localStorage.getItem('fg_sms_sync') || 0; } catch (e) {}
    const msgs = (await NATIVE_SMS.readInbox({ since: Math.max(last, monthStartMs()), limit: 50 })).messages.map(m => ({ sender: m.sender || 'BANK', text: m.text }));
    try { localStorage.setItem('fg_sms_sync', String(Date.now() - 60000)); } catch (e) {}
    if (!msgs.length) return;
    const d = await api('POST', '/sms/import', { messages: msgs });
    if (d.result.added) { render(); toast(`Auto-added ${d.result.added} from SMS (+${fmt(d.result.income)})`); }
  } catch (e) { /* silent: background sync */ }
}
function listenPhoneSms() {
  if (!NATIVE_SMS) return;
  NATIVE_SMS.addListener('smsReceived', async m => {
    if (!TOKEN) return;
    try {
      const d = await api('POST', '/sms/import', { messages: [{ sender: m.sender || 'BANK', text: m.text }] });
      if (d.result.added) { render(); toast(d.result.income ? `+${fmt(d.result.income)} income added from SMS` : `−${fmt(d.result.spent)} spend logged from SMS`); }
    } catch (e) {}
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncPhoneSms(); });
}
async function modalSms() {
  try {
    if (!SMS_INBOX.length) SMS_INBOX = NATIVE_SMS ? await readPhoneSms(monthStartMs()) : (await api('GET', '/sms/sample')).messages;
  } catch (e) { toast(e.message, '#FF5C6F'); return; }
  openSheet(`<div class="sheet-title">${ic('msg', 24)}Import from SMS</div>
    <div class="small muted" style="margin-bottom:12px">${NATIVE_SMS ? `Found <b style="color:#fff">${SMS_INBOX.length}</b> bank &amp; UPI messages on this phone this month. Personal chats and OTPs are filtered out on your phone and never sent.`
      : `Demo inbox. In the <a href="/download/FinanceGuru.apk" style="color:var(--accent)">Android app</a>, Finance Guru reads your real bank &amp; UPI messages (with your permission). OTPs and personal chats are skipped and never stored.`}</div>
    <div id="sms_list">${SMS_INBOX.length ? SMS_INBOX.map(smsBubble).join('') : '<div class="empty">No bank messages this month yet.</div>'}</div>
    <div class="field" style="margin-top:12px"><label>Or paste any bank SMS</label><textarea id="sms_paste" placeholder="e.g. Rs.1,150.00 credited to A/c XX2153 by SWIGGY on 20-11-26"></textarea></div>
    <button class="btn ghost" id="sms_add" style="margin-bottom:10px">Add pasted SMS</button>
    <button class="btn" id="sms_scan">Scan ${SMS_INBOX.length} messages</button>`, sh => {
    sh.querySelector('#sms_add').onclick = () => {
      const v = sh.querySelector('#sms_paste').value.trim(); if (!v) return toast('Paste an SMS first', '#FF5C6F');
      SMS_INBOX.unshift({ sender: 'PASTED', text: v.slice(0, 500) }); SMS_INBOX = SMS_INBOX.slice(0, 50); modalSms();
    };
    sh.querySelector('#sms_scan').onclick = () => SMS_INBOX.length ? scanSms(sh) : toast('No messages to scan', '#FF5C6F');
  });
}
function smsBubble(m, i) {
  return `<div class="sms" id="sms_${i}"><div class="from"><span>${esc(m.sender)}</span></div><div class="txt">${esc(m.text)}</div><div class="res"></div></div>`;
}
async function scanSms(sh) {
  const btn = sh.querySelector('#sms_scan'); btn.disabled = true; btn.textContent = 'Reading messages…';
  let items;
  try { items = (await api('POST', '/sms/preview', { messages: SMS_INBOX })).items; }
  catch (e) { toast(e.message, '#FF5C6F'); btn.disabled = false; btn.textContent = 'Scan messages'; return; }
  for (let i = 0; i < items.length; i++) {
    await new Promise(r => setTimeout(r, 160));
    const it = items[i], el = sh.querySelector('#sms_' + i); if (!el) return;
    const res = el.querySelector('.res');
    if (it.status === 'ok') {
      el.classList.add('ok');
      res.innerHTML = `<span style="color:${it.type === 'income' ? 'var(--pos)' : '#fff'}">${ic(it.icon, 16)}</span><b class="${it.type === 'income' ? 'green-t' : ''}">${it.type === 'income' ? '+' : '−'}${fmt(it.amount)}</b>
        <span>${esc(it.merchant)}</span><span class="tag" style="margin-left:auto">${esc(it.category)}</span>`;
    } else { el.classList.add('skip'); res.innerHTML = `${ic('close', 14)}<span>${esc(it.reason)}</span>`; }
  }
  const good = items.filter(x => x.status === 'ok');
  if (!good.length) { btn.textContent = 'Nothing new to import'; return; }
  const inc = good.filter(x => x.type === 'income').reduce((a, x) => a + x.amount, 0);
  btn.disabled = false; btn.textContent = `Add ${good.length} transactions (+${fmt(inc)} income)`;
  btn.onclick = () => act(btn, async () => {
    const d = await api('POST', '/sms/import', { messages: SMS_INBOX });
    SMS_INBOX = []; return d;
  }, `Imported ${good.length} transactions from SMS`);
}
async function applySurplus(btn) {
  const sp = STATE.insights && STATE.insights.surplus; if (!sp) return;
  const steps = sp.steps.filter(s => s.id === 'emer' || s.id === 'lean');
  await act(btn, async () => { for (const s of steps) await api('POST', `/buffers/${s.id}/deposit`, { amount: s.amount, note: 'Surplus plan' }); },
    'Moved ' + fmt(steps.reduce((a, s) => a + s.amount, 0)) + ' to your buffers');
}

function showWrapUp(w) {
  const [y, m] = w.monthKey.split('-').map(Number), d = new Date(y, m - 1, 1);
  openSheet(`<div class="sheet-title">${ic('calendar', 22)}Month Wrap-Up</div>
    <div class="h2">Last month: ${d.toLocaleString('en-IN', { month: 'long', year: 'numeric' })}</div>
    <div class="card">
      <div class="list-row"><div class="mid">${ic('trend', 18)}<div>Income earned</div></div><div class="amt green-t">${fmt(w.income)}</div></div>
      <div class="list-row"><div class="mid">${ic('shield', 18)}<div>Savings made</div></div><div class="amt gold-t">${fmt(w.saved)}</div></div>
      <div class="list-row"><div class="mid">${ic('card', 18)}<div>Expenses paid</div></div><div class="amt">${fmt(w.paid)}</div></div>
    </div>
    <p class="muted" style="margin-bottom:14px">Your buffers are kept safe. Log this month's income to get started.</p>
    <button class="btn" id="w_go">Log Income</button>`, sh => { sh.querySelector('#w_go').onclick = () => { closeSheet(); setTimeout(modalIncome, 50); }; });
}

/* ================= 6. EVENT LISTENERS ================= */
function switchTab(t) {
  if (t === UI.tab) { document.getElementById('screen').scrollTop = 0; return; }
  const dir = TABS.indexOf(t) > TABS.indexOf(UI.tab) ? 'slide-left' : 'slide-right';
  UI.tab = t; document.getElementById('screen').scrollTop = 0; render(dir);
}
function bindEvents() {
  document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.getElementById('overlay').onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  const scr = document.getElementById('screen');
  scr.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-goto],[data-delinc],[data-delexp],[data-dep],[data-wd],[data-tv]');
    if (!t) return;
    const d = t.dataset;
    if (d.act) ({ income: modalIncome, expense: modalExpense, save: () => modalSave(), draw: () => modalDraw(), settings: modalSettings, addexp: modalAddExpense, sms: modalSms, surplus: () => applySurplus(t),
      editexp: () => { UI.editExp = !UI.editExp; render(); } })[d.act]();
    else if (d.goto) switchTab(d.goto);
    else if (d.delinc) {
      if (!confirm('Delete this income entry?')) return;
      act(t, () => api('DELETE', '/income/' + d.delinc), 'Entry removed');
    } else if (d.delexp) {
      if (!confirm('Delete this expense?')) return;
      act(t, () => api('DELETE', '/expenses/' + d.delexp), 'Expense deleted');
    } else if (d.dep) modalSave(d.dep);
    else if (d.wd) modalDraw(d.wd);
    else if (d.tv) { UI.trendView = d.tv; render(); }
  });
  scr.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.togexp) act(null, () => api('PATCH', '/expenses/' + t.dataset.togexp, { active: t.checked }));
    else if (t.dataset.expamt) act(null, () => api('PATCH', '/expenses/' + t.dataset.expamt, { amount: Math.max(0, Math.round(+t.value || 0)) }), 'Amount updated');
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (UI.tab === 'trends' && UI.trendView === 'chart') setupChart(); }, 100); });
}

/* ================= 7. CANVAS CHART ================= */
function setupChart() {
  const canvas = document.getElementById('chart'); if (!canvas) return;
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = 220;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const data = chartDataWithForecast();
  drawChart(canvas, data, w, h);
  const tip = document.getElementById('tip');
  const show = (clientX) => {
    const r = canvas.getBoundingClientRect(), x = clientX - r.left;
    const bar = UI.chartBars.find(b => x >= b.slotX && x < b.slotX + b.slotW);
    if (!bar) { tip.style.display = 'none'; return; }
    tip.innerHTML = bar.m.forecast ? `${bar.m.month} '${bar.m.year} forecast: ${fmt(bar.m.income)} · ${Math.round(bar.m.pLean * 100)}% lean` : `${bar.m.month} '${bar.m.year}: ${fmt(bar.m.income)}${bar.m.lean ? ' · LEAN' : ''}`;
    tip.style.borderColor = bar.color; tip.style.display = 'block';
    tip.style.left = Math.min(Math.max(bar.cx, 60), w - 60) + 'px'; tip.style.top = Math.max(bar.top, 30) + 'px';
  };
  canvas.onmousemove = e => show(e.clientX);
  canvas.onmouseleave = () => { tip.style.display = 'none'; };
  canvas.onclick = e => show(e.clientX);
  canvas.ontouchstart = e => show(e.touches[0].clientX);
}
function drawChart(canvas, historyData, W, H) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const PAD = { top: 20, right: 10, bottom: 40, left: 50 };
  const CW = W - PAD.left - PAD.right, CH = H - PAD.top - PAD.bottom;
  const MAX = Math.max(30000, Math.ceil(Math.max(...historyData.map(m => m.income)) / 10000) * 10000);
  const ticks = []; for (let v = 0; v <= MAX; v += 10000) ticks.push(v);
  ticks.forEach(v => {
    const y = PAD.top + CH - (v / MAX) * CH;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W - PAD.right, y); ctx.stroke();
    ctx.fillStyle = '#8F8A8D'; ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    ctx.fillText('₹' + (v / 1000) + 'K', PAD.left - 6, y + 4);
  });
  // lean threshold line
  const ly = PAD.top + CH - (LEAN_LIMIT / MAX) * CH;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,68,102,.5)'; ctx.beginPath(); ctx.moveTo(PAD.left, ly); ctx.lineTo(W - PAD.right, ly); ctx.stroke(); ctx.setLineDash([]);
  const n = Math.max(12, historyData.length), slotW = CW / n, barW = slotW * 0.65;
  const offset = n - historyData.length;
  UI.chartBars = [];
  historyData.forEach((m, j) => {
    const i = j + offset;
    const bh = Math.max(0, (m.income / MAX) * CH);
    const bx = PAD.left + i * slotW + (slotW - barW) / 2, by = PAD.top + CH - bh;
    if (m.forecast) {
      const fcol = m.pLean >= 0.5 ? '#FF5C6F' : '#F2B544';
      // uncertainty whisker (80% range)
      const yl = PAD.top + CH - Math.min(1, m.low / MAX) * CH, yh = PAD.top + CH - Math.min(1, m.high / MAX) * CH;
      ctx.strokeStyle = fcol; ctx.globalAlpha = .55; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(bx + barW / 2, yl); ctx.lineTo(bx + barW / 2, yh); ctx.moveTo(bx + barW * .3, yh); ctx.lineTo(bx + barW * .7, yh); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.setLineDash([3, 3]); ctx.strokeStyle = fcol; ctx.fillStyle = m.pLean >= 0.5 ? 'rgba(255,92,111,.16)' : 'rgba(242,181,68,.14)';
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, barW, bh, [3, 3, 0, 0]); else ctx.rect(bx, by, barW, bh);
      ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = fcol; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(m.month, bx + barW / 2, H - PAD.bottom + 14);
      UI.chartBars.push({ m, color: fcol, slotX: PAD.left + i * slotW, slotW, cx: bx + barW / 2, top: by });
      return;
    }
    const color = m.lean ? '#FF5C6F' : m.current ? '#FFFFFF' : '#FFFFFF';
    ctx.fillStyle = m.lean || m.current ? color : 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, barW, bh, [3, 3, 0, 0]); else ctx.rect(bx, by, barW, bh);
    ctx.fill();
    ctx.fillStyle = m.lean ? '#FF5C6F' : m.current ? '#FFFFFF' : '#8F8A8D';
    ctx.font = (m.lean || m.current ? 'bold ' : '') + '9px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(m.month, bx + barW / 2, H - PAD.bottom + 14);
    UI.chartBars.push({ m, color, slotX: PAD.left + i * slotW, slotW, cx: bx + barW / 2, top: by });
  });
}

/* ================= 8. INIT ================= */
async function init() {
  document.querySelectorAll('[data-i]').forEach(el => el.innerHTML = ic(el.dataset.i, 22));
  loadState();          // show the cached copy instantly
  bindEvents();
  listenPhoneSms();
  render();
  if (!TOKEN) return;
  try {                 // then refresh from the server (also does month rollover)
    const d = await api('GET', '/state');
    render();
    if (d.wrapUp) setTimeout(() => showWrapUp(d.wrapUp), 300);
    syncPhoneSms();
  } catch (e) { toast(e.message, '#FF5C6F'); }
}
window.onload = init;
</script>
