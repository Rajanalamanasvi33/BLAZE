# Render Blueprint — Finance Guru on the FREE plan.
# Note: free instances have no persistent disk, so the SQLite database resets when the
# service restarts or sleeps. "Load Demo (Raju)" always works because it reseeds.
# For permanent data: change plan to "starter" and add a disk mounted at /var/data with DATA_DIR=/var/data.
services:
  - type: web
    name: finance-guru
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: FG_SECRET
        generateValue: true   # random token-signing secret (keeps logins valid across restarts)
